<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A12"/>
      <stop offset="50%" stop-color="#0F1424"/>
      <stop offset="100%" stop-color="#0A0D18"/>
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2438"/>
      <stop offset="100%" stop-color="#141829"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 32px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 500; fill: #94A3B8; }
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 17px; font-weight: 700; fill: #FFFFFF; }
    .card-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 400; fill: #CBD5E1; line-height: 1.5; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 700; fill: #38BDF8; letter-spacing: 1px; }
    .pointer { stroke-width: 2; fill: none; stroke-linecap: round; }
  </style>

  <rect width="1600" height="1000" fill="url(#bgGrad)"/>
  <circle cx="800" cy="500" r="450" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="800" cy="500" r="600" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="12 12" opacity="0.2"/>

  <g transform="translate(800, 50)" text-anchor="middle">
    <text class="title">Photo &amp; Video Organizer 2.0</text>
    <text y="32" class="subtitle">Interactive Interface Map • 100% Offline • Zero Cloud Telemetry</text>
  </g>

  <!-- Central App Screenshot -->
  <g transform="translate(535, 120)">
    <rect x="-6" y="-6" width="530" height="682" rx="20" fill="#252D47" opacity="0.6"/>
    <rect x="-2" y="-2" width="522" height="674" rx="16" fill="#0E121E"/>
    <image href="app_screenshot.jpg" x="0" y="0" width="518" height="670" clip-path="inset(0% round 14px)" filter="url(#shadow)"/>
  </g>

  <!-- LEFT CALLOUTS -->
  <g transform="translate(60, 160)">
    <rect width="400" height="120" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="32" class="badge">DISPLAY &amp; STATUS</text>
    <text x="24" y="60" class="card-title">1. Status Monitor &amp; Top Notch</text>
    <text x="24" y="86" class="card-desc">Signature pill notch + clean screen area. Displays real-time progress, processed files, and sorting metrics.</text>
    <path d="M 400,60 L 540,240" class="pointer" stroke="#38BDF8" stroke-dasharray="4 4"/>
    <circle cx="540" cy="240" r="5" fill="#38BDF8"/>
  </g>

  <g transform="translate(60, 390)">
    <rect width="400" height="145" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="32" class="badge">OPERATING MODES</text>
    <text x="24" y="60" class="card-title">2. Processing Mode Selector</text>
    <text x="24" y="85" class="card-desc">• FULL: Full date-based Year/Month sorting + deduplication.</text>
    <text x="24" y="105" class="card-desc">• DUPLICATE: Isolate exact duplicates using SHA-256 hash.</text>
    <text x="24" y="125" class="card-desc">• OTHER: Extract screenshots (&lt;100KB) and documents.</text>
    <path d="M 400,65 L 580,440" class="pointer" stroke="#818CF8" stroke-dasharray="4 4"/>
    <circle cx="580" cy="440" r="5" fill="#818CF8"/>
  </g>

  <g transform="translate(60, 640)">
    <rect width="400" height="150" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="32" class="badge">SMART STORAGE</text>
    <text x="24" y="60" class="card-title">3. Source &amp; Destination Folder Grid</text>
    <text x="24" y="85" class="card-desc">• Temp: Source folder (from phone, camera SD card, drive).</text>
    <text x="24" y="105" class="card-desc">• Media: Target library organized into YYYY/MM folders.</text>
    <text x="24" y="125" class="card-desc">• Duplicate / Other: Isolated folders for duplicates and non-media.</text>
    <path d="M 400,60 L 580,630" class="pointer" stroke="#A78BFA" stroke-dasharray="4 4"/>
    <circle cx="580" cy="630" r="5" fill="#A78BFA"/>
  </g>

  <!-- RIGHT CALLOUTS -->
  <g transform="translate(1140, 560)">
    <rect width="400" height="135" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="32" class="badge" fill="#34D399">EXECUTION ENGINE</text>
    <text x="24" y="60" class="card-title">4. Circular START Button</text>
    <text x="24" y="85" class="card-desc">One-click execution running on a dedicated worker thread (QThread). Zero UI freezes.</text>
    <text x="24" y="110" class="card-desc">Dynamically switches to STOP button during execution.</text>
    <path d="M 0,65 L -260,110" class="pointer" stroke="#34D399" stroke-dasharray="4 4"/>
    <circle cx="880" cy="670" r="5" fill="#34D399"/>
  </g>

  <g transform="translate(1140, 310)">
    <rect width="400" height="175" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="24" y="32" class="badge">UTILITIES &amp; LOCALIZATION</text>
    <text x="24" y="60" class="card-title">5. Quick Action Utility Sidebar</text>
    <text x="24" y="85" class="card-desc">• [ ? ]: Help dialog &amp; safe one-click Undo system.</text>
    <text x="24" y="105" class="card-desc">• [ 🇬🇧 / 🇷🇺 / 🇨🇳 ]: Instant 3-language cycle with reactive flags.</text>
    <text x="24" y="125" class="card-desc">• [ GitHub ]: One-click access to open source repository.</text>
    <text x="24" y="145" class="card-desc">• [ Donate ]: Support independent open-source development.</text>
    <path d="M 0,80 L -120,330" class="pointer" stroke="#38BDF8" stroke-dasharray="4 4"/>
    <circle cx="1020" cy="640" r="5" fill="#38BDF8"/>
  </g>

  <g transform="translate(800, 930)" text-anchor="middle">
    <rect x="-350" y="-30" width="700" height="50" rx="25" fill="#131A2E" stroke="#253252" stroke-width="1"/>
    <text y="3" font-family="-apple-system, sans-serif" font-size="14" font-weight="600" fill="#94A3B8">
      🔒 100% Offline • Zero Subscription • No Cloud Uploads • Open Source
    </text>
  </g>
</svg>
