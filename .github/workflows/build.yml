name: Build Windows Executable (.exe)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pyinstaller

    - name: Build Single-File EXE
      shell: pwsh
      run: |
        pyinstaller --name=PhotoVideoOrganizer --noconsole --onefile --add-data "assets;assets" --clean main.py

    - name: Verify Executable
      run: |
        if (Test-Path "dist\PhotoVideoOrganizer.exe") {
            Write-Host "✅ PhotoVideoOrganizer.exe created successfully!"
            Get-Item "dist\PhotoVideoOrganizer.exe" | Select-Object Name, Length
        } else {
            Write-Error "❌ Executable was not found!"
            exit 1
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PhotoVideoOrganizer-Windows
        path: dist/PhotoVideoOrganizer.exe
        if-no-files-found: error
