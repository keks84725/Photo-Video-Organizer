name: Build & Release Windows Executable

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish .exe to GitHub Release?'
        type: boolean
        required: true
        default: false
      tag_name:
        description: 'Target release tag (e.g. v2.0)'
        type: string
        required: false
        default: 'v2.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip install pyinstaller

    - name: Build Single-File EXE
      shell: pwsh
      run: |
        pyinstaller --name=PhotoVideoOrganizer --noconsole --onefile --add-data "assets;assets" --clean main.py

    - name: Verify Executable & Compute SHA-256
      run: |
        python scripts/verify_build.py

    - name: Save Artifact (Private Build Storage)
      uses: actions/upload-artifact@v4
      with:
        name: PhotoVideoOrganizer-Windows
        path: dist/PhotoVideoOrganizer.exe
        if-no-files-found: error

    - name: Attach to GitHub Release (When requested)
      if: ${{ github.event.inputs.publish_release == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.inputs.tag_name || 'v2.0' }}
      run: |
        echo "🚀 Attaching PhotoVideoOrganizer.exe to Release: $TAG"
        gh release upload "$TAG" "dist/PhotoVideoOrganizer.exe" --clobber
        echo "✅ Successfully attached PhotoVideoOrganizer.exe to release $TAG!"
